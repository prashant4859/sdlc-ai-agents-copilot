services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set local database configuration}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${POSTGRES_APP_USER}" = "$${POSTGRES_USER}" ]; then
          echo "POSTGRES_APP_USER must differ from POSTGRES_USER." >&2
          exit 1
        fi
        docker-entrypoint.sh postgres &
        postgres_pid=$!
        stop_postgres() {
          kill "$${postgres_pid}" 2>/dev/null || true
          wait "$${postgres_pid}" 2>/dev/null || true
        }
        trap stop_postgres EXIT
        attempts=0
        until psql \
          --set=ON_ERROR_STOP=1 \
          --username "$${POSTGRES_USER}" \
          --dbname "$${POSTGRES_DB}" \
          --command='SELECT 1' >/dev/null 2>&1; do
          if ! kill -0 "$${postgres_pid}" 2>/dev/null; then
            wait "$${postgres_pid}"
            exit 1
          fi
          attempts=$$((attempts + 1))
          if [ "$${attempts}" -ge 60 ]; then
            echo "PostgreSQL did not become ready for application-role provisioning." >&2
            exit 1
          fi
          sleep 1
        done
        /bin/sh /opt/sports-paradise/init/010-create-app-role.sh
        trap - EXIT
        wait "$${postgres_pid}"
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432
    volumes:
      - sports-paradise-postgres-data:/var/lib/postgresql/data
      - ./database/init:/opt/sports-paradise/init:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U "$${POSTGRES_APP_USER}" -d "$${POSTGRES_DB}" -c "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  sports-paradise-postgres-data:
